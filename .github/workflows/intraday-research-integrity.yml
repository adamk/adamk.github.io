name: Intraday historical research integrity

on:
  push:
    paths:
      - algo-pnl.html
      - js/algo-pnl-research-integrity.js
      - js/live-benchmarks.js
      - scripts/refresh_live_benchmarks.py
      - data/live-benchmarks.json
      - data/historical-cash-benchmark.json
      - data/intraday_research*.json
      - data/intraday_research*.csv
      - data/intraday_spread_only*.csv
      - data/historical_comparison*.json
      - data/combined_research*.json
      - data/multiday_research*.json
      - data/benchmark_research*.json
      - data/algo-pnl.json
      - tests/*.js
      - tests/*.py
      - .github/workflows/intraday-research-integrity.yml
  pull_request:
    paths:
      - algo-pnl.html
      - js/algo-pnl-research-integrity.js
      - js/live-benchmarks.js
      - scripts/refresh_live_benchmarks.py
      - data/live-benchmarks.json
      - data/historical-cash-benchmark.json
      - data/intraday_research*.json
      - data/intraday_research*.csv
      - data/intraday_spread_only*.csv
      - data/historical_comparison*.json
      - data/combined_research*.json
      - data/multiday_research*.json
      - data/benchmark_research*.json
      - data/algo-pnl.json
      - tests/*.js
      - tests/*.py
      - .github/workflows/intraday-research-integrity.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/algo-pnl-research-integrity.js
      - run: node --check js/live-benchmarks.js
      - run: python3 -m unittest discover -s tests -p 'test_refresh_live_benchmarks.py'
      - run: node --test tests/*.test.js
